<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여울귀신 일정표</title>
  
  <link rel="icon" href="https://emojicdn.elk.sh/🎾">
  <link rel="apple-touch-icon" href="https://emojicdn.elk.sh/🎾">
  
  <meta property="og:title" content="여울귀신 일정표">
  <meta property="og:description" content="구글 캘린더 일정을 실시간 분석합니다.">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { 
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: #f8fafc;
      word-break: keep-all;
    }
    .card-3d {
      background: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-bottom: 3px solid #cbd5e1;
    }
    .btn-3d-primary { box-shadow: 0 4px 0 0 #c2410c; }
    .btn-3d-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 0 #c2410c; }
    .btn-3d-light { box-shadow: 0 3px 0 0 #cbd5e1; }
    .btn-3d-light:active { transform: translateY(2px); box-shadow: 0 1px 0 0 #cbd5e1; }
    .calendar-day-box { min-height: 64px; height: 64px; }
    @media (min-width: 640px) {
      .calendar-day-box { min-height: 112px; height: 112px; }
    }
  </style>
</head>
<body class="text-slate-900 min-h-screen p-2 sm:p-6 md:p-8 antialiased text-xs sm:text-base">
  <div class="max-w-7xl mx-auto space-y-4 sm:space-y-7">
    
    <!-- 상단 히어로 타이틀 헤더 -->
    <header class="bg-gradient-to-r from-amber-100 via-orange-200 to-amber-200 text-amber-950 p-3.5 sm:p-6 rounded-2xl sm:rounded-3xl shadow-xl shadow-orange-900/5 flex items-center justify-between border border-white/60 border-b-4 border-b-orange-300">
      <div class="flex items-center gap-2.5 sm:gap-4 overflow-hidden">
        <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-full bg-white/90 border border-white flex items-center justify-center shadow-md backdrop-blur-md shrink-0 overflow-hidden p-0.5">
          <img src="https://emojicdn.elk.sh/🎾" alt="여울귀신" class="w-full h-full object-contain rounded-full">
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <h1 class="text-base sm:text-2xl font-black tracking-tight text-amber-950 truncate">여울귀신 일정표</h1>
            <span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[9px] sm:text-xs font-extrabold bg-orange-500 text-white shadow-sm shrink-0">LIVE</span>
          </div>
          <p class="text-[10px] sm:text-sm text-amber-900/80 mt-0.5 font-semibold truncate">구글 캘린더 일정을 실시간 분석합니다.</p>
        </div>
      </div>
    </header>

    <!-- 1. 월별 모임 일정표 -->
    <div class="card-3d p-2 sm:p-7 rounded-2xl sm:rounded-3xl space-y-3 sm:space-y-4">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-slate-200 pb-3 sm:pb-4 gap-2.5 px-1 sm:px-0">
        <div class="space-y-0.5">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-orange-500 shadow-sm shrink-0"></span>
            <h2 id="calendarTitle" class="text-sm sm:text-xl font-black text-slate-800 truncate">모임 일정표</h2>
          </div>
          <!-- 모바일 월간보기에서만 노출되는 안내 문구 -->
          <p id="guideText" class="text-[11px] text-slate-500 font-medium pl-4.5 sm:hidden">💡 일정을 터치하여 참석자를 확인해 보세요!</p>
        </div>
        
        <div class="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto">
          <div class="inline-flex bg-slate-200/80 p-1 rounded-xl border border-slate-300 shadow-inner shrink-0">
            <button onclick="setViewMode('calendar')" id="btnModeCalendar" class="px-3 py-1.5 rounded-lg text-xs font-extrabold transition bg-white text-orange-600 shadow-sm flex items-center gap-1">📅 월간보기</button>
            <button onclick="setViewMode('list')" id="btnModeList" class="px-3 py-1.5 rounded-lg text-xs font-extrabold transition text-slate-600 hover:text-slate-900 flex items-center gap-1">📋 일정보기</button>
          </div>

          <div class="flex items-center gap-1 shrink-0">
            <button onclick="changeMonth(-1)" class="w-8 h-8 sm:w-10 sm:h-10 bg-white hover:bg-amber-50 text-slate-700 font-extrabold rounded-xl flex items-center justify-center btn-3d-light border border-slate-200 transition text-xs sm:text-sm">◀</button>
            <button onclick="changeMonth(1)" class="w-8 h-8 sm:w-10 sm:h-10 bg-white hover:bg-amber-50 text-slate-700 font-extrabold rounded-xl flex items-center justify-center btn-3d-light border border-slate-200 transition text-xs sm:text-sm">▶</button>
          </div>
        </div>
      </div>

      <div id="calendarDisplayContainer" class="pt-1 w-full overflow-hidden"></div>
    </div>

    <!-- 2. 통계 조회 기간 설정바 -->
    <div class="card-3d p-3.5 sm:p-5 rounded-2xl sm:rounded-3xl space-y-2.5 sm:space-y-3 bg-gradient-to-r from-slate-50 to-amber-50/30">
      <div class="flex items-center gap-1.5 text-xs sm:text-sm font-bold text-slate-800">
        <span class="w-2.5 h-2.5 rounded-full bg-orange-500 shadow-sm shrink-0"></span> 참석현황 통계 조회 기간 설정
      </div>
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
        <div class="flex items-center gap-1.5 flex-1 min-w-0">
          <input type="month" id="startMonthInput" class="w-full min-w-0 px-2.5 sm:px-3 py-2 sm:py-2.5 bg-white border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 font-bold outline-none focus:ring-2 focus:ring-orange-400 transition shadow-inner">
          <span class="text-slate-600 font-bold shrink-0">~</span>
          <input type="month" id="endMonthInput" class="w-full min-w-0 px-2.5 sm:px-3 py-2 sm:py-2.5 bg-white border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 font-bold outline-none focus:ring-2 focus:ring-orange-400 transition shadow-inner">
        </div>
        <button onclick="loadStatsData()" class="w-full sm:w-auto px-5 py-2 sm:py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-black rounded-xl text-xs sm:text-sm flex items-center justify-center gap-1.5 btn-3d-primary transition shadow-sm shrink-0">조회하기</button>
      </div>
    </div>

    <!-- 3. 참석현황 -->
    <div class="space-y-4 sm:space-y-7 pt-1">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shrink-0"></span>
        <h2 class="text-sm sm:text-xl font-black text-slate-800 truncate">참석현황 통계</h2>
      </div>

      <!-- 지표 카드 -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-5">
        <div class="card-3d p-4 sm:p-6 rounded-2xl sm:rounded-3xl hover:-translate-y-1 transition-all duration-200 flex items-center justify-between group border-l-4 border-l-orange-500">
          <div>
            <p class="text-[11px] sm:text-sm font-bold text-orange-600 uppercase tracking-wider">총 일정</p>
            <p id="totalEvents" class="text-xl sm:text-4xl font-black text-slate-800 mt-1.5 tracking-tight">0<span class="text-xs sm:text-lg font-bold text-orange-500 ml-1">건</span></p>
          </div>
          <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-xl sm:rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-lg sm:text-2xl font-bold group-hover:scale-110 transition-transform shadow-inner border border-orange-200 shrink-0">📋</div>
        </div>

        <div class="card-3d p-4 sm:p-6 rounded-2xl sm:rounded-3xl hover:-translate-y-1 transition-all duration-200 flex items-center justify-between group border-l-4 border-l-emerald-500">
          <div>
            <p class="text-[11px] sm:text-sm font-bold text-emerald-600 uppercase tracking-wider">총 참석자</p>
            <p id="totalAttendees" class="text-xl sm:text-4xl font-black text-slate-800 mt-1.5 tracking-tight">0<span class="text-xs sm:text-lg font-bold text-emerald-500 ml-1">명</span></p>
          </div>
          <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-xl sm:rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg sm:text-2xl font-bold group-hover:scale-110 transition-transform shadow-inner border border-emerald-200 shrink-0">👥</div>
        </div>

        <div class="card-3d p-4 sm:p-6 rounded-2xl sm:rounded-3xl hover:-translate-y-1 transition-all duration-200 flex items-center justify-between group border-l-4 border-l-amber-500">
          <div class="min-w-0 pr-2">
            <p class="text-[11px] sm:text-sm font-bold text-amber-600 uppercase tracking-wider">최다 참석자</p>
            <p id="topAttendee" class="text-sm sm:text-2xl font-black text-amber-600 mt-1.5 truncate tracking-tight">-</p>
          </div>
          <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-xl sm:rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg sm:text-2xl font-bold group-hover:scale-110 transition-transform shadow-inner border border-amber-200 shrink-0">🏆</div>
        </div>
      </div>

      <!-- 차트 -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-3.5 sm:gap-5">
        <div class="card-3d p-4 sm:p-6 rounded-2xl sm:rounded-3xl">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs sm:text-base font-extrabold text-slate-800 flex items-center gap-1.5 truncate">
              <span class="w-2.5 h-2.5 rounded-full bg-orange-500 shrink-0"></span> 월별 시간대별 일정 현황
            </h3>
            <span class="text-[10px] sm:text-xs font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded-md border border-orange-200 shadow-sm shrink-0">18시/20시</span>
          </div>
          <div class="relative h-[200px] sm:h-[260px]"><canvas id="monthlyChart"></canvas></div>
        </div>

        <div class="card-3d p-4 sm:p-6 rounded-2xl sm:rounded-3xl">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs sm:text-base font-extrabold text-slate-800 flex items-center gap-1.5 truncate">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span> 참석 횟수 Top 10
            </h3>
            <span class="text-[10px] sm:text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200 shadow-sm shrink-0">상위 순위</span>
          </div>
          <div class="relative h-[200px] sm:h-[260px]"><canvas id="attendeeChart"></canvas></div>
        </div>
      </div>

      <!-- 테이블 -->
      <div class="card-3d rounded-2xl sm:rounded-3xl overflow-hidden">
        <div class="p-4 sm:p-6 border-b border-slate-200 flex items-center justify-between bg-slate-50/80">
          <h3 class="text-xs sm:text-base font-extrabold text-slate-800"><span>👤 인원별 참석 현황</span></h3>
          <span class="text-[10px] sm:text-xs font-bold text-slate-400 shrink-0">실시간 파싱</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs sm:text-sm text-slate-700 whitespace-nowrap sm:whitespace-normal">
            <thead class="bg-slate-100 text-slate-600 font-extrabold uppercase tracking-wider text-[10px] sm:text-xs border-b border-slate-200">
              <tr>
                <th class="p-3 sm:p-5 w-16 sm:w-28 text-center">순위</th>
                <th class="p-3 sm:p-5">이름</th>
                <th class="p-3 sm:p-5 text-center">최근 참석일</th>
                <th class="p-3 sm:p-5 text-right pr-4 sm:pr-8">참석 횟수</th>
              </tr>
            </thead>
            <tbody id="attendeeTableBody" class="divide-y divide-slate-100">
              <tr><td colspan="4" class="p-6 sm:p-10 text-center text-slate-400 font-medium">데이터를 불러오는 중입니다...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 모달 -->
  <div id="eventModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-4 sm:p-5 max-w-sm w-full shadow-2xl border border-slate-100 space-y-2">
      <div class="border-b border-slate-100 pb-1.5">
        <h3 id="modalDateTitle" class="text-base sm:text-lg font-black text-slate-800">날짜</h3>
      </div>
      <div id="modalContentBody" class="space-y-1.5 max-h-[60vh] overflow-y-auto pr-1 pb-3"></div>
      <button onclick="closeModal()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-xs sm:text-sm transition shadow-sm">확인</button>
    </div>
  </div>

  <script>
    const API_KEY = "AIzaSyDKHKIJGfPXfyN7G7puTs8XrBZKPiBSCP0";
    const CALENDAR_ID = "aefd539b231a85ce02afd23de338fda979c6ac1b2be3ec62ee91fb6aebfdb022@group.calendar.google.com";

    let monthlyChartInstance = null, attendeeChartInstance = null;
    let calendarEventsList = [], statsEventsList = [];
    let currentViewMode = 'calendar', currentViewDate = new Date();

    window.onload = () => {
      const now = new Date();
      document.getElementById('endMonthInput').value = fmtYM(now);
      document.getElementById('startMonthInput').value = fmtYM(new Date(now.getFullYear(), now.getMonth() - 2, 1));
      loadCalendarMonthData();
      loadStatsData();
    };

    function fmtYM(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    }

    async function fetchEvents(start, end) {
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&maxResults=2500&singleEvents=true&orderBy=startTime&timeMin=${start.toISOString()}&timeMax=${end.toISOString()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('데이터를 불러오지 못했습니다.');
      return (await res.json()).items || [];
    }

    // 일정 타이틀은 원본 그대로 반환
    function formatEventDisplayTitle(evt) {
      return evt.summary || '일정';
    }

    // 📌 일정 설명에서 앞 2글자 추출 후 무조건 "예약"으로 고정 표기 (이모지 제외)
    function parseReservationTag(descriptionText) {
      if (!descriptionText) return '';
      const regex = /([가-힣]{2})\s*(예약|대관)/;
      const match = descriptionText.match(regex);
      if (match) {
        return `${match[1]} 예약`;
      }
      return '';
    }

    async function loadCalendarMonthData() {
      const y = currentViewDate.getFullYear(), m = currentViewDate.getMonth() + 1;
      calendarEventsList = await fetchEvents(new Date(y, m - 1, 1), new Date(y, m, 1)).catch(() => []);
      renderCalendarSection();
    }

    async function loadStatsData() {
      const start = document.getElementById('startMonthInput').value;
      const end = document.getElementById('endMonthInput').value;
      const tMin = start ? new Date(`${start}-01T00:00:00Z`).toISOString() : '';
      const tMax = end ? (() => { const [y, m] = end.split('-'); return new Date(y, m, 1).toISOString(); })() : '';
      
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&maxResults=2500&singleEvents=true&orderBy=startTime${tMin ? '&timeMin='+tMin : ''}${tMax ? '&timeMax='+tMax : ''}`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('통계 데이터를 불러오지 못했습니다.');
        statsEventsList = (await res.json()).items || [];
        processCalendarData(statsEventsList);
      } catch (err) { alert(err.message); }
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('btnModeCalendar').className = mode === 'calendar' ? "px-3 py-1.5 rounded-lg text-xs font-extrabold transition bg-white text-orange-600 shadow-sm flex items-center gap-1" : "px-3 py-1.5 rounded-lg text-xs font-extrabold transition text-slate-600 hover:text-slate-900 flex items-center gap-1";
      document.getElementById('btnModeList').className = mode === 'list' ? "px-3 py-1.5 rounded-lg text-xs font-extrabold transition bg-white text-orange-600 shadow-sm flex items-center gap-1" : "px-3 py-1.5 rounded-lg text-xs font-extrabold transition text-slate-600 hover:text-slate-900 flex items-center gap-1";
      
      const guideText = document.getElementById('guideText');
      if (window.innerWidth < 640) {
        guideText.style.display = mode === 'calendar' ? 'block' : 'none';
      }

      renderCalendarSection();
    }

    function changeMonth(dir) {
      currentViewDate.setMonth(currentViewDate.getMonth() + dir);
      loadCalendarMonthData();
    }

    function renderCalendarSection() {
      if (currentViewMode === 'calendar') renderMonthCalendarView();
      else renderScheduleListView();
    }

    // 1. 월간보기 (모바일 원본 유지, PC 2번째 줄 우측 정렬)
    function renderMonthCalendarView() {
      const y = currentViewDate.getFullYear(), m = currentViewDate.getMonth() + 1;
      document.getElementById('calendarTitle').innerText = `${y}년 ${m}월 모임 일정표`;

      const container = document.getElementById('calendarDisplayContainer');
      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-7 gap-0.5 sm:gap-2 text-center w-full';

      ['일', '월', '화', '수', '목', '금', '토'].forEach((day, idx) => {
        const h = document.createElement('div');
        h.className = `font-black text-[11px] sm:text-sm py-1 sm:py-1.5 ${idx === 0 ? 'text-rose-500' : idx === 6 ? 'text-sky-600' : 'text-slate-600'}`;
        h.innerText = day;
        grid.appendChild(h);
      });

      const eventsByDate = getGroupedEventsMapFull();
      const firstDay = new Date(y, m - 1, 1).getDay();
      const lastDate = new Date(y, m, 0).getDate();
      const todayStr = new Date().toISOString().substring(0, 10);

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'calendar-day-box bg-slate-50/50 rounded-md sm:rounded-xl border border-slate-100 opacity-40';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayCell = document.createElement('div');
        const isToday = dateStr === todayStr;
        const dayOfWeek = new Date(y, m - 1, d).getDay();
        const numColor = dayOfWeek === 0 ? 'text-rose-500' : dayOfWeek === 6 ? 'text-sky-600' : 'text-slate-700';

        dayCell.className = `calendar-day-box ${isToday ? 'border-2 border-orange-500 bg-orange-50/30' : 'border border-slate-200 bg-white'} p-0.5 sm:p-1 rounded-md sm:rounded-xl flex flex-col justify-start text-left shadow-2xs hover:border-orange-300 transition overflow-hidden space-y-0.5 sm:space-y-1`;

        let cellHTML = `<div class="font-extrabold text-[10px] sm:text-sm ${numColor} ${isToday ? 'bg-orange-500 text-white w-4 h-4 sm:w-5 sm:h-5 rounded-full flex items-center justify-center text-[9px]' : ''}">${d}</div>`;
        const dayItem = eventsByDate[dateStr] || { evt18: null, evt20: null };

        if (dayItem.evt18 || dayItem.evt20) {
          if (window.innerWidth < 640) {
            dayCell.classList.add('cursor-pointer', 'hover:bg-amber-50/30');
            dayCell.onclick = () => openModal(dateStr, dayItem);
          }
        }

        let eventsHTML = `<div class="space-y-0.5 sm:space-y-1 w-full flex flex-col overflow-hidden">`;
        ['evt18', 'evt20'].forEach(key => {
          const evt = dayItem[key];
          if (evt) {
            const rawTitle = formatEventDisplayTitle(evt.raw);
            const reservationTag = parseReservationTag(evt.raw.description);
            const shortTxt = rawTitle.split(/[\s\n]+/)[0];
            const bgClass = key === 'evt18' ? 'bg-emerald-100/80 border-emerald-300/70 text-emerald-950' : 'bg-amber-100/90 border-amber-300/80 text-amber-950';
            const tagColor = key === 'evt18' ? 'text-emerald-800' : 'text-orange-800';
            
            eventsHTML += `<div class="${bgClass} border px-0.5 py-0.5 rounded text-[10px] sm:text-xs leading-tight font-bold sm:line-clamp-2 sm:overflow-hidden sm:text-ellipsis sm:h-[2.3rem]">
              <span class="sm:hidden block text-center truncate" style="font-variant-numeric: tabular-nums;">${shortTxt}</span>
              <div class="hidden sm:block text-left truncate">${rawTitle}</div>
              ${reservationTag ? `<div class="hidden sm:block text-right text-[11px] font-normal ${tagColor} truncate">${reservationTag}</div>` : ''}
            </div>`;
          } else {
            eventsHTML += `<div class="opacity-0 border border-transparent px-0.5 py-0.5 rounded text-[10px] sm:text-xs leading-tight pointer-events-none select-none sm:h-[2.3rem]"><span class="sm:hidden block truncate">&nbsp;</span><span class="hidden sm:block">&nbsp;</span></div>`;
          }
        });
        eventsHTML += `</div>`;
        
        dayCell.innerHTML = cellHTML + eventsHTML;
        grid.appendChild(dayCell);
      }

      container.innerHTML = '';
      container.appendChild(grid);
    }

    // 2. 일정보기 (시간 배지 바로 옆 간격 배치, 테마 일치형 색상, 굵기 완화)
    function renderScheduleListView() {
      const y = currentViewDate.getFullYear(), m = currentViewDate.getMonth() + 1;
      document.getElementById('calendarTitle').innerText = `${y}년 ${m}월 모임 일정표`;

      const container = document.getElementById('calendarDisplayContainer');
      container.innerHTML = '';

      const targetStr = `${y}-${String(m).padStart(2, '0')}`;
      const filtered = calendarEventsList.filter(e => (e.start?.dateTime || e.start?.date)?.startsWith(targetStr));

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-400 font-medium text-xs sm:text-sm">해당 월에 등록된 일정이 없습니다.</div>`;
        return;
      }

      const listWrapper = document.createElement('div');
      listWrapper.className = 'space-y-1.5 sm:space-y-2 max-h-[420px] overflow-y-auto pr-1';
      const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
      const grouped = {};

      filtered.forEach(e => {
        const dKey = (e.start?.dateTime || e.start?.date).substring(0, 10);
        if (!grouped[dKey]) grouped[dKey] = [];
        grouped[dKey].push(e);
      });

      Object.keys(grouped).sort().forEach(dKey => {
        const dateObj = new Date(dKey);
        grouped[dKey].sort((a, b) => new Date(a.start?.dateTime || a.start?.date).getHours() - new Date(b.start?.dateTime || b.start?.date).getHours());

        grouped[dKey].forEach(evt => {
          const hour = new Date(evt.start?.dateTime || evt.start?.date).getHours();
          const is20 = hour >= 19;
          const displayTitle = formatEventDisplayTitle(evt);
          const reservationTag = parseReservationTag(evt.description);
          const tagColor = is20 ? 'text-orange-800' : 'text-emerald-800';

          const item = document.createElement('div');
          item.className = `p-2 sm:p-3 ${is20 ? 'bg-amber-100/80 border-amber-300/70 text-amber-950' : 'bg-emerald-100/70 border-emerald-300/60 text-emerald-950'} border rounded-xl sm:rounded-2xl flex items-center justify-between gap-2.5 shadow-2xs transition`;
          item.innerHTML = `
            <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
              <div class="w-8 h-8 sm:w-12 sm:h-12 rounded-lg sm:rounded-xl bg-white border border-slate-200 flex flex-col items-center justify-center text-slate-800 shadow-inner shrink-0">
                <span class="text-[8px] sm:text-[9px] font-bold text-slate-400">${weekDays[dateObj.getDay()]}</span>
                <span class="text-xs sm:text-base font-black text-slate-800 leading-none">${dateObj.getDate()}</span>
              </div>
              <div class="space-y-0.5 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="inline-block px-1.5 py-0.2 ${is20 ? 'bg-orange-500' : 'bg-emerald-600'} text-white rounded-md text-[9px] font-black shadow-xs">${is20 ? '20시' : '18시'}</span>
                  ${reservationTag ? `<span class="font-normal text-xs sm:text-sm ${tagColor}">${reservationTag}</span>` : ''}
                </div>
                <p class="font-bold text-xs sm:text-sm break-words">${displayTitle}</p>
              </div>
            </div>`;
          listWrapper.appendChild(item);
        });
      });

      container.appendChild(listWrapper);
    }

    function getGroupedEventsMapFull() {
      const map = {};
      calendarEventsList.forEach(evt => {
        const startRaw = evt.start?.dateTime || evt.start?.date;
        if (!startRaw) return;
        const dKey = startRaw.substring(0, 10);
        if (!map[dKey]) map[dKey] = { evt18: null, evt20: null };
        if (new Date(startRaw).getHours() >= 19) map[dKey].evt20 = { raw: evt };
        else map[dKey].evt18 = { raw: evt };
      });
      return map;
    }

    // 3. 모바일 월간보기 팝업창 (시간 배지 바로 옆 간격 배치, 테마 일치형 색상, 굵기 완화)
    function openModal(dateStr, dayItem) {
      const parts = dateStr.split('-');
      document.getElementById('modalDateTitle').innerText = `${parts[0]}년 ${parseInt(parts[1])}월 ${parseInt(parts[2])}일`;
      
      let html = '';
      if (dayItem.evt18) {
        const title18 = formatEventDisplayTitle(dayItem.evt18.raw);
        const tag18 = parseReservationTag(dayItem.evt18.raw.description);
        html += `<div class="p-2.5 bg-emerald-50 border border-emerald-200 rounded-xl space-y-1">
          <div class="flex items-center gap-2">
            <span class="inline-block px-2 py-0.5 bg-emerald-600 text-white rounded-md text-[10px] font-black">18시 일정</span>
            ${tag18 ? `<span class="font-normal text-xs sm:text-sm text-emerald-800">${tag18}</span>` : ''}
          </div>
          <p class="font-bold text-slate-800 text-sm sm:text-base">${title18}</p>
        </div>`;
      }
      if (dayItem.evt20) {
        const title20 = formatEventDisplayTitle(dayItem.evt20.raw);
        const tag20 = parseReservationTag(dayItem.evt20.raw.description);
        html += `<div class="p-2.5 bg-amber-50 border border-amber-200 rounded-xl space-y-1">
          <div class="flex items-center gap-2">
            <span class="inline-block px-2 py-0.5 bg-orange-500 text-white rounded-md text-[10px] font-black">20시 일정</span>
            ${tag20 ? `<span class="font-normal text-xs sm:text-sm text-orange-800">${tag20}</span>` : ''}
          </div>
          <p class="font-bold text-slate-800 text-sm sm:text-base">${title20}</p>
        </div>`;
      }
      
      document.getElementById('modalContentBody').innerHTML = html;
      document.getElementById('eventModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('eventModal').classList.add('hidden'); }

    function processCalendarData(events) {
      document.getElementById('totalEvents').innerHTML = `${events.length}<span class="text-xs sm:text-lg font-bold text-orange-500 ml-1">건</span>`;
      const mCount = {}, attendees = {}, nowTs = Date.now();

      events.forEach(evt => {
        const startRaw = evt.start?.dateTime || evt.start?.date;
        if (!startRaw) return;
        const eDate = new Date(startRaw);
        const mKey = startRaw.substring(0, 7);
        
        if (!mCount[mKey]) mCount[mKey] = { '18시': 0, '20시': 0 };
        if (eDate.getHours() >= 19) mCount[mKey]['20시']++; else mCount[mKey]['18시']++;

        const fDate = `${String(eDate.getFullYear()).substring(2)}.${String(eDate.getMonth() + 1).padStart(2, '0')}.${String(eDate.getDate()).padStart(2, '0')}`;
        const title = evt.summary || '';
        if (!title) return;

        title.replace(/\([^)]*\)/g, "").split(/[,/\s]+/).forEach(token => {
          const name = token.trim();
          if (name && !/[월화수목금토일]\d/.test(name) && !name.includes('/') && !/^\d+$/.test(name) && !name.includes(':') && !name.includes('게스트') && name.length >= 2) {
            if (!attendees[name]) attendees[name] = { count: 0, lastDate: '-', lastTimestamp: 0 };
            attendees[name].count++;
            if (eDate.getTime() <= nowTs && eDate.getTime() >= attendees[name].lastTimestamp) {
              attendees[name].lastDate = fDate;
              attendees[name].lastTimestamp = eDate.getTime();
            }
          }
        });
      });

      const sorted = Object.entries(attendees).sort((a, b) => b[1].count - a[1].count);
      document.getElementById('totalAttendees').innerHTML = `${sorted.length}<span class="text-xs sm:text-lg font-bold text-emerald-500 ml-1">명</span>`;
      document.getElementById('topAttendee').innerText = sorted[0] ? `${sorted[0][0]} (${sorted[0][1].count}회)` : '-';

      renderTable(sorted);
      renderCharts(mCount, sorted);
    }

    function renderTable(memberList) {
      const tbody = document.getElementById('attendeeTableBody');
      tbody.innerHTML = memberList.length === 0 ? '<tr><td colspan="4" class="p-8 text-center text-slate-400 font-medium text-xs sm:text-sm">조회된 기간 내 인식된 참석자가 없습니다.</td></tr>' : '';
      
      memberList.forEach(([name, data], idx) => {
        let badge = `<span class="inline-flex items-center justify-center w-7 h-7 sm:w-8 sm:h-8 rounded-full text-xs font-bold bg-slate-200 text-slate-600 shadow-inner">${idx + 1}</span>`;
        let rowBg = "hover:bg-slate-50";
        if (idx === 0) { badge = '🥇'; rowBg = "bg-amber-50/40 hover:bg-amber-50/60"; }
        else if (idx === 1) badge = '🥈';
        else if (idx === 2) badge = '🥉';

        tbody.innerHTML += `<tr class="${rowBg} transition-colors duration-150">
          <td class="p-2.5 sm:p-4.5 text-center flex items-center justify-center">${typeof badge === 'string' && badge.length > 2 ? badge : `<span class="inline-flex items-center justify-center w-8 sm:w-11 h-8 sm:h-11 rounded-xl sm:rounded-2xl text-base sm:text-2xl font-bold bg-gradient-to-b from-amber-100 to-amber-200 text-amber-800 shadow-md border-2 border-amber-300">${badge}</span>`}</td>
          <td class="p-2.5 sm:p-4.5 font-bold text-slate-800 text-xs sm:text-base">${name}</td>
          <td class="p-2.5 sm:p-4.5 text-center"><span class="inline-block px-2 sm:px-3 py-1 bg-slate-100 text-slate-700 rounded-md sm:rounded-lg text-[10px] sm:text-xs font-bold border border-slate-200 shadow-inner">${data.lastDate}</span></td>
          <td class="p-2.5 sm:p-4.5 font-black text-orange-600 text-right pr-4 sm:pr-8 text-xs sm:text-base">${data.count}<span class="text-[10px] sm:text-xs font-bold text-slate-400 ml-1">회</span></td>
        </tr>`;
      });
    }

    function renderCharts(mCount, attendeeList) {
      if (monthlyChartInstance) monthlyChartInstance.destroy();
      if (attendeeChartInstance) attendeeChartInstance.destroy();

      const keys = Object.keys(mCount).sort();
      const mCtx = document.getElementById('monthlyChart').getContext('2d');
      const aCtx = document.getElementById('attendeeChart').getContext('2d');

      const g18 = mCtx.createLinearGradient(0, 0, 0, 260); g18.addColorStop(0, '#fb923c'); g18.addColorStop(1, '#ea580c');
      const g20 = mCtx.createLinearGradient(0, 0, 0, 260); g20.addColorStop(0, '#38bdf8'); g20.addColorStop(1, '#0284c7');

      monthlyChartInstance = new Chart(mCtx, {
        type: 'bar',
        data: {
          labels: keys.map(k => k.substring(2).replace('-', '.')),
          datasets: [
            { label: '18시', data: keys.map(k => mCount[k]['18시']), backgroundColor: g18, borderRadius: 4, barPercentage: 0.45, categoryPercentage: 0.65 },
            { label: '20시', data: keys.map(k => mCount[k]['20시']), backgroundColor: g20, borderRadius: 4, barPercentage: 0.45, categoryPercentage: 0.65 }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top', labels: { font: { family: 'Pretendard', weight: 'bold', size: 10 }, boxWidth: 8 } } }, scales: { y: { grid: { color: '#e2e8f0' } }, x: { grid: { display: false } } } }
      });

      const top10 = attendeeList.slice(0, 10);
      const gTop = aCtx.createLinearGradient(0, 0, 300, 0); gTop.addColorStop(0, '#34d399'); gTop.addColorStop(1, '#059669');

      attendeeChartInstance = new Chart(aCtx, {
        type: 'bar',
        data: {
          labels: top10.map(i => i[0]),
          datasets: [{ label: '참석 횟수', data: top10.map(i => i[1].count), backgroundColor: gTop, borderRadius: 6, barPercentage: 0.55, categoryPercentage: 0.65 }]
        },
        options: { 
          indexAxis: 'y', 
          responsive: true, 
          maintainAspectRatio: false, 
          plugins: { legend: { display: false } }, 
          scales: { 
            x: { grid: { color: '#e2e8f0' } }, 
            y: { 
              grid: { display: false },
              ticks: {
                autoSkip: false,
                font: {
                  family: 'Pretendard',
                  weight: 'bold',
                  size: 10
                }
              }
            } 
          } 
        }
      });
    }
  </script>
</body>
